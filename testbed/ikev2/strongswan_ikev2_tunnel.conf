# StrongSwan IKEv2 Hardened Tunnel Configuration (Secure Baseline)
# PRD Case 1: IKEv2 + Tunnel + AES-256-GCM + DH-19 + PFS ON + Anti-Replay ON

config setup
    charondebug="ike 2, knl 2, cfg 2, esp 2"
    uniqueids=yes

conn %default
    keyexchange=ikev2
    ike=aes256gcm16-prfsha256-ecp256!
    esp=aes256gcm16-ecp256!
    dpdaction=restart
    dpddelay=30s
    inactivity=28800s
    replay_window=1024

conn secure-tunnel
    left=203.0.113.10
    leftsubnet=10.100.0.0/16
    leftcert=gatewayCert.pem
    leftid=@gateway1.cybersec.internal
    right=198.51.100.20
    rightsubnet=172.16.0.0/16
    rightid=@gateway2.cybersec.internal
    type=tunnel
    auto=start
